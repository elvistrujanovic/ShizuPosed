
name: Build ShizuPosed APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile ShizuPosed
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. Install required Android SDK components
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0"

      # 5. Configure Gradle 9.8.2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      # 6. Verify build environment
      - name: Check build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # 7. Compile ShizuPosed
      - name: Build Debug APK
        run: |
          gradle clean :app:assembleDebug --no-daemon

      # 8. Verify APK output
      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # 9. Upload APK to GitHub Actions
      - name: Upload ShizuPosed APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizuPosed-Android16-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
