
name: Build ShizuPosed APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ShizuPosed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK platform 37.0
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Checking available Android SDK platforms..."

          sdkmanager --list --channel=3 > sdk-packages.txt

          if grep -q 'platforms;android-37\.0' sdk-packages.txt; then
            echo "Installing Android API 37.0..."
            sdkmanager --install --channel=3 \
              "platforms;android-37.0"
          elif grep -q 'platforms;android-37 ' sdk-packages.txt; then
            echo "Installing Android API 37..."
            sdkmanager --install --channel=3 \
              "platforms;android-37"
          else
            echo "ERROR: Android API 37 platform not found."
            cat sdk-packages.txt
            exit 1
          fi

          echo "Installing Android Build Tools..."
          sdkmanager --install \
            "build-tools;36.0.0"

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true

      # 5. Configure Gradle
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      # 6. Verify environment
      - name: Verify build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      # 7. Build ShizuPosed
      - name: Compile ShizuPosed Debug APK
        run: |
          gradle clean :app:assembleDebug --no-daemon

      # 8. Verify generated APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload ShizuPosed APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizuPosed-Android16-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
